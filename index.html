<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deathstalker: Vertical Slice</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #0b0c10;
      color: #c5c6c7;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 1024px;
      height: 768px;
      box-shadow: 0 0 30px rgba(102, 252, 241, 0.15), 0 0 10px rgba(0, 0, 0, 0.8);
      border: 1px solid #1f2833;
      background: #0d1117;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="battle-canvas" width="1024" height="768"></canvas>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
