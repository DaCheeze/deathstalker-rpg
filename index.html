<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deathstalker: Tactical JRPG</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #0b0c10;
      color: #c5c6c7;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #app {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 177.78vh; /* 16:9 aspect */
      max-height: 56.25vw; /* 16:9 aspect */
      box-shadow: 0 0 30px rgba(102, 252, 241, 0.15), 0 0 10px rgba(0, 0, 0, 0.8);
      background: #0d1117;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .dev-tuner-link {
      position: absolute;
      top: 8px;
      right: 16px;
      color: #38bdf8;
      font-size: 13px;
      text-decoration: none;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid #334155;
      padding: 4px 10px;
      border-radius: 3px;
      z-index: 100;
      font-weight: bold;
      opacity: 0.6;
      transition: opacity 0.2s ease;
    }
    .dev-tuner-link:hover {
      opacity: 1;
      background: #0284c7;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="game-container">
      <a href="?mode=tuner" class="dev-tuner-link">⚡ TUNER</a>
      <canvas id="battle-canvas" width="1920" height="1080"></canvas>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
